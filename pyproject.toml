[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extreme_gans"
version = "0.2.0"
description = "GAN models for extreme multivariate time-series generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Amartya (Marty) Mukherjee"}
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "torch>=2.0"
]

[project.urls]
Homepage = "https://github.com/amartyamukherjee/ExtremeGANs"
Repository = "https://github.com/amartyamukherjee/ExtremeGANs"

[tool.setuptools.packages.find]
where = ["."]
include = ["extreme_gans*"]
